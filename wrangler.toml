# Cloudflare Worker: serves the static SPA in ./dist AND the /api/* backend,
# backed by D1 (data) and a Durable Object per account (realtime).
#
# Local dev:   npx wrangler dev         (http://localhost:8787)
# Deploy:      npx wrangler deploy
# Create D1:   npx wrangler d1 create myboard   (copy the id into database_id)

name = "myboard"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Static SPA: everything not matched by /api/* falls through to the built assets.
# run_worker_first ensures /api/* always reaches the Worker — otherwise the SPA
# fallback intercepts browser navigations (e.g. /api/auth/google) and serves HTML.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "myboard"
# Replace with the id printed by `wrangler d1 create myboard`. Local dev works
# with this placeholder because wrangler keeps a local SQLite copy.
database_id = "a30e7376-a084-4aa3-9bed-af5a7ec6d841"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
APP_NAME = "SimpleBoard"
# Public origin used to build magic-link and OAuth callback URLs.
# Override per environment; must match what you deploy to.
PUBLIC_BASE_URL = "https://myboard.oeunvicheka95.workers.dev"
